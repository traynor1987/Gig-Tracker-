name: Build signed Gig Tracker APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Android wrapper
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .signing/gig-tracker-debug.keystore
          key: gig-tracker-debug-signing-v1

      - name: Build signed release APK
        env:
          GIG_TRACKER_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.signing/gig-tracker-debug.keystore
        run: ./build-debug.sh "$ANDROID_SDK_ROOT"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: gig-tracker-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
