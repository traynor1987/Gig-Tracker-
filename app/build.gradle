apply plugin: "com.android.application"

android {
    namespace "site.chatgpt.traynor1987.gigtracker"
    compileSdk 35

    defaultConfig {
        applicationId "site.chatgpt.traynor1987.gigtracker"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1-debug"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
